name: Check workflow files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: |
          GOBIN=$(pwd) go install github.com/rhysd/actionlint/cmd/actionlint@latest
      
      - name: Run actionlint
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        run: |
          ./actionlint
